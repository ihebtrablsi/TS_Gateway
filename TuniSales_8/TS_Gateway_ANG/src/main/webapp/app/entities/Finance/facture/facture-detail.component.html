<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="facture">
            <h2><span jhiTranslate="tsGatewayAngApp.financeFacture.detail.title">Facture</span> {{ facture.id }}</h2>

            <hr>

            <jhi-alert-error></jhi-alert-error>

            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="tsGatewayAngApp.financeFacture.numeroFacture">Numero Facture</span></dt>
                <dd>
                    <span>{{ facture.numeroFacture }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.financeFacture.dateFacture">Date Facture</span></dt>
                <dd>
                    <span>{{ facture.dateFacture }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.financeFacture.montantTotal">Montant Total</span></dt>
                <dd>
                    <span>{{ facture.montantTotal }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.financeFacture.statut">Statut</span></dt>
                <dd>
                    <span>{{ facture.statut }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.financeFacture.dateEcheance">Date Echeance</span></dt>
                <dd>
                    <span>{{ facture.dateEcheance }}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/facture', facture.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
            </button>
        </div>
    </div>
</div>
