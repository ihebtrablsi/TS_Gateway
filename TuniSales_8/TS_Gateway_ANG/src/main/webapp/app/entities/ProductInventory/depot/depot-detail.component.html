<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="depot">
            <h2><span jhiTranslate="tsGatewayAngApp.productInventoryDepot.detail.title">Depot</span> {{ depot.id }}</h2>

            <hr>

            <jhi-alert-error></jhi-alert-error>

            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryDepot.nom">Nom</span></dt>
                <dd>
                    <span>{{ depot.nom }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryDepot.adresse">Adresse</span></dt>
                <dd>
                    <span>{{ depot.adresse }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryDepot.typeDepot">Type Depot</span></dt>
                <dd>
                    <span>{{ depot.typeDepot }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryDepot.capacite">Capacite</span></dt>
                <dd>
                    <span>{{ depot.capacite }}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/depot', depot.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
            </button>
        </div>
    </div>
</div>
