<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="panierBonus">
            <h2><span jhiTranslate="tsGatewayAngApp.clientSalesPanierBonus.detail.title">Panier Bonus</span> {{ panierBonus.id }}</h2>

            <hr>

            <jhi-alert-error></jhi-alert-error>

            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="tsGatewayAngApp.clientSalesPanierBonus.totalPoints">Total Points</span></dt>
                <dd>
                    <span>{{ panierBonus.totalPoints }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.clientSalesPanierBonus.totalValeur">Total Valeur</span></dt>
                <dd>
                    <span>{{ panierBonus.totalValeur }}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/panier-bonus', panierBonus.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
            </button>
        </div>
    </div>
</div>
