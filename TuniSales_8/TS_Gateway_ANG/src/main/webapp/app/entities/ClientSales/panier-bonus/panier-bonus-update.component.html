<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-panier-bonus-heading" jhiTranslate="tsGatewayAngApp.clientSalesPanierBonus.home.createOrEditLabel">Create or edit a Panier Bonus</h2>

            <div>
                <jhi-alert-error></jhi-alert-error>

                <div class="form-group" [hidden]="!editForm.get('id')!.value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id" readonly />
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="tsGatewayAngApp.clientSalesPanierBonus.totalPoints" for="field_totalPoints">Total Points</label>
                    <input type="number" class="form-control" name="totalPoints" id="field_totalPoints"
                           formControlName="totalPoints"/>
                    <div *ngIf="editForm.get('totalPoints')!.invalid && (editForm.get('totalPoints')!.dirty || editForm.get('totalPoints')!.touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('totalPoints')?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('totalPoints')?.errors?.min" jhiTranslate="entity.validation.min" [translateValues]="{ min: 0 }">
                            This field should be at least 0.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.get('totalPoints')?.errors?.number" jhiTranslate="entity.validation.number">
                            This field should be a number.
                        </small>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="tsGatewayAngApp.clientSalesPanierBonus.totalValeur" for="field_totalValeur">Total Valeur</label>
                    <input type="number" class="form-control" name="totalValeur" id="field_totalValeur"
                           formControlName="totalValeur"/>
                    <div *ngIf="editForm.get('totalValeur')!.invalid && (editForm.get('totalValeur')!.dirty || editForm.get('totalValeur')!.touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('totalValeur')?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('totalValeur')?.errors?.min" jhiTranslate="entity.validation.min" [translateValues]="{ min: 0 }">
                            This field should be at least 0.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.get('totalValeur')?.errors?.number" jhiTranslate="entity.validation.number">
                            This field should be a number.
                        </small>
                    </div>
                </div>
            </div>

            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary" (click)="previousState()">
                    <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>

                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
