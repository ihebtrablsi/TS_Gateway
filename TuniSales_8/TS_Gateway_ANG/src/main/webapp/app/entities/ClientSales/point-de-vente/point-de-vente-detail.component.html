<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="pointDeVente">
            <h2><span jhiTranslate="tsGatewayAngApp.clientSalesPointDeVente.detail.title">Point De Vente</span> {{ pointDeVente.id }}</h2>

            <hr>

            <jhi-alert-error></jhi-alert-error>

            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="tsGatewayAngApp.clientSalesPointDeVente.nom">Nom</span></dt>
                <dd>
                    <span>{{ pointDeVente.nom }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.clientSalesPointDeVente.adresse">Adresse</span></dt>
                <dd>
                    <span>{{ pointDeVente.adresse }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.clientSalesPointDeVente.ville">Ville</span></dt>
                <dd>
                    <span>{{ pointDeVente.ville }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.clientSalesPointDeVente.codePostal">Code Postal</span></dt>
                <dd>
                    <span>{{ pointDeVente.codePostal }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.clientSalesPointDeVente.telephone">Telephone</span></dt>
                <dd>
                    <span>{{ pointDeVente.telephone }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.clientSalesPointDeVente.latitude">Latitude</span></dt>
                <dd>
                    <span>{{ pointDeVente.latitude }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.clientSalesPointDeVente.longitude">Longitude</span></dt>
                <dd>
                    <span>{{ pointDeVente.longitude }}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/point-de-vente', pointDeVente.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
            </button>
        </div>
    </div>
</div>
