<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="ristourne">
            <h2><span jhiTranslate="tsGatewayAngApp.financeRistourne.detail.title">Ristourne</span> {{ ristourne.id }}</h2>

            <hr>

            <jhi-alert-error></jhi-alert-error>

            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="tsGatewayAngApp.financeRistourne.montant">Montant</span></dt>
                <dd>
                    <span>{{ ristourne.montant }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.financeRistourne.dateAttribution">Date Attribution</span></dt>
                <dd>
                    <span>{{ ristourne.dateAttribution }}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/ristourne', ristourne.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
            </button>
        </div>
    </div>
</div>
