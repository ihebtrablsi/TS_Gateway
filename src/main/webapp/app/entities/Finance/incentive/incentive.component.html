<div>
    <h2 id="page-heading">
        <span jhiTranslate="tsGatewayAngApp.financeIncentive.home.title">Incentives</span>

        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-incentive" [routerLink]="['/incentive/new']">
            <fa-icon icon="plus"></fa-icon>
            <span  jhiTranslate="tsGatewayAngApp.financeIncentive.home.createLabel">
            Create a new Incentive
            </span>
        </button>
    </h2>

    <jhi-alert-error></jhi-alert-error>

    <jhi-alert></jhi-alert>

    <div class="alert alert-warning" id="no-result" *ngIf="incentives?.length === 0">
        <span jhiTranslate="tsGatewayAngApp.financeIncentive.home.notFound">No incentives found</span>
    </div>

    <div class="table-responsive" id="entities" *ngIf="incentives && incentives.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
                <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" [callback]="loadPage.bind(this)">
                    <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"  jhiSortBy="nom"><span jhiTranslate="tsGatewayAngApp.financeIncentive.nom">Nom</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"  jhiSortBy="description"><span jhiTranslate="tsGatewayAngApp.financeIncentive.description">Description</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"  jhiSortBy="dateDebut"><span jhiTranslate="tsGatewayAngApp.financeIncentive.dateDebut">Date Debut</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"  jhiSortBy="dateFin"><span jhiTranslate="tsGatewayAngApp.financeIncentive.dateFin">Date Fin</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"  jhiSortBy="regles"><span jhiTranslate="tsGatewayAngApp.financeIncentive.regles">Regles</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"  jhiSortBy="bonus"><span jhiTranslate="tsGatewayAngApp.financeIncentive.bonus">Bonus</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let incentive of incentives ;trackBy: trackId">
                    <td><a [routerLink]="['/incentive', incentive.id, 'view']">{{ incentive.id }}</a></td>
                    <td>{{ incentive.nom }}</td>
                    <td>{{ incentive.description }}</td>
                    <td>{{ incentive.dateDebut | date:'medium' }}</td>
                    <td>{{ incentive.dateFin | date:'medium' }}</td>
                    <td>{{ incentive.regles }}</td>
                    <td>{{ incentive.bonus }}</td>
                    <td class="text-right">
                        <div class="btn-group">
                            <button type="submit"
                                    [routerLink]="['/incentive', incentive.id, 'view']"
                                    class="btn btn-info btn-sm">
                                <fa-icon icon="eye"></fa-icon>
                                <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                            </button>

                            <button type="submit"
                                    [routerLink]="['/incentive', incentive.id, 'edit']"
                                    class="btn btn-primary btn-sm">
                                <fa-icon icon="pencil-alt"></fa-icon>
                                <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                            </button>

                            <button type="submit" (click)="delete(incentive)"
                                    class="btn btn-danger btn-sm">
                                <fa-icon icon="times"></fa-icon>
                                <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div *ngIf="incentives && incentives.length > 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>

        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="ngbPaginationPage" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage($event)"></ngb-pagination>
        </div>
    </div>
</div>
