<div>
    <h2 id="page-heading">
        <span jhiTranslate="tsGatewayAngApp.financeLettrage.home.title">Lettrages</span>

        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-lettrage" [routerLink]="['/lettrage/new']">
            <fa-icon icon="plus"></fa-icon>
            <span  jhiTranslate="tsGatewayAngApp.financeLettrage.home.createLabel">
            Create a new Lettrage
            </span>
        </button>
    </h2>

    <jhi-alert-error></jhi-alert-error>

    <jhi-alert></jhi-alert>

    <div class="alert alert-warning" id="no-result" *ngIf="lettrages?.length === 0">
        <span jhiTranslate="tsGatewayAngApp.financeLettrage.home.notFound">No lettrages found</span>
    </div>

    <div class="table-responsive" id="entities" *ngIf="lettrages && lettrages.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
                <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" [callback]="loadPage.bind(this)">
                    <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"  jhiSortBy="dateLettrage"><span jhiTranslate="tsGatewayAngApp.financeLettrage.dateLettrage">Date Lettrage</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"  jhiSortBy="montantLettre"><span jhiTranslate="tsGatewayAngApp.financeLettrage.montantLettre">Montant Lettre</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"  jhiSortBy="factureId"><span jhiTranslate="tsGatewayAngApp.financeLettrage.facture">Facture</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"  jhiSortBy="paiementId"><span jhiTranslate="tsGatewayAngApp.financeLettrage.paiement">Paiement</span> <fa-icon icon="sort"></fa-icon></th>
                    <th scope="col"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let lettrage of lettrages ;trackBy: trackId">
                    <td><a [routerLink]="['/lettrage', lettrage.id, 'view']">{{ lettrage.id }}</a></td>
                    <td>{{ lettrage.dateLettrage | date:'medium' }}</td>
                    <td>{{ lettrage.montantLettre }}</td>
                    <td>
                        <div *ngIf="lettrage.factureId">
                            <a [routerLink]="['/facture', lettrage.factureId , 'view']" >{{ lettrage.factureId }}</a>
                        </div>
                    </td>
                    <td>
                        <div *ngIf="lettrage.paiementId">
                            <a [routerLink]="['/paiement', lettrage.paiementId , 'view']" >{{ lettrage.paiementId }}</a>
                        </div>
                    </td>
                    <td class="text-right">
                        <div class="btn-group">
                            <button type="submit"
                                    [routerLink]="['/lettrage', lettrage.id, 'view']"
                                    class="btn btn-info btn-sm">
                                <fa-icon icon="eye"></fa-icon>
                                <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                            </button>

                            <button type="submit"
                                    [routerLink]="['/lettrage', lettrage.id, 'edit']"
                                    class="btn btn-primary btn-sm">
                                <fa-icon icon="pencil-alt"></fa-icon>
                                <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                            </button>

                            <button type="submit" (click)="delete(lettrage)"
                                    class="btn btn-danger btn-sm">
                                <fa-icon icon="times"></fa-icon>
                                <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div *ngIf="lettrages && lettrages.length > 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>

        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="ngbPaginationPage" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage($event)"></ngb-pagination>
        </div>
    </div>
</div>
