<div>
    <h2 id="page-heading">
        <span jhiTranslate="tsGatewayAngApp.clientSalesCommande.home.title">Commandes</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity" [routerLink]="['/commande/new']">
            <fa-icon icon="plus"></fa-icon>
            <span jhiTranslate="tsGatewayAngApp.clientSalesCommande.home.createLabel">Créer une nouvelle commande</span>
        </button>
    </h2>

    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>

    <div class="alert alert-warning" *ngIf="commandes?.length === 0">
        <span jhiTranslate="tsGatewayAngApp.clientSalesCommande.home.notFound">Aucune commande trouvée</span>
    </div>

    <dx-data-grid
        *ngIf="commandes"
        [dataSource]="commandes"
        keyExpr="id"
        [rowAlternationEnabled]="true"
        [showBorders]="true"
        [columnAutoWidth]="true"
        [allowColumnResizing]="true"
        [columnResizingMode]="'nextColumn'"
        [searchPanel]="{ visible: true, width: 240, placeholder: 'Rechercher une commande...' }"
        (onRowDblClick)="onRowDblClick($event)"
        (onSelectionChanged)="selectedChanged($event)"
        (onCellPrepared)="onCellPrepared($event)"
    >

        <!-- Date -->
        <dxi-column
            dataField="dateCommande"
            [caption]="'tsGatewayAngApp.clientSalesCommande.dateCommande' | translate"
            dataType="date">
        </dxi-column>

        <!-- Statut -->
        <dxi-column
            dataField="statut"
            [caption]="'tsGatewayAngApp.clientSalesCommande.statut' | translate">
        </dxi-column>

        <!-- Total -->
        <dxi-column
            dataField="total"
            [caption]="'tsGatewayAngApp.clientSalesCommande.total' | translate"
            dataType="number"
            format="#,##0.00">
        </dxi-column>

        <!-- Client -->
        <dxi-column
            dataField="client"
            [caption]="'tsGatewayAngApp.clientSalesCommande.client' | translate" [calculateCellValue]="clientNom">
        </dxi-column>

        <!-- Point de Vente -->
        <dxi-column
            dataField="pointDeVente"
            [caption]="'tsGatewayAngApp.clientSalesCommande.pointDeVente' | translate" [calculateCellValue]="pointDeVenteNom">
        </dxi-column>

        <!-- Action -->
        <dxi-column
            [caption]="'Action'"
            [width]="90">
        </dxi-column>
    </dx-data-grid>

    <!-- Modal suppression -->
    <ng-template #deleteModal let-deleteModal class="modal-dialog">
        <form (ngSubmit)="confirmDelete(deleteModal)">
            <div class="modal-header">
                <h4 class="modal-title">Confirmation de suppression</h4>
            </div>
            <div class="modal-body">
                <p>Êtes-vous sûr de vouloir supprimer cette commande ?</p>
                <strong>{{ commande?.total }}</strong>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" (click)="deleteModal.close()">Annuler</button>
                <button type="submit" class="btn btn-danger">Supprimer</button>
            </div>
        </form>
    </ng-template>

    <!-- Pagination -->
    <div *ngIf="commandes && commandes.length > 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination
                [collectionSize]="totalItems"
                [(page)]="ngbPaginationPage"
                [pageSize]="itemsPerPage"
                [maxSize]="5"
                [rotate]="true"
                [boundaryLinks]="true"
                (pageChange)="loadPage($event)">
            </ngb-pagination>
        </div>
    </div>
</div>
