<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-commande-heading" jhiTranslate="tsGatewayAngApp.clientSalesCommande.home.createOrEditLabel">Create or edit a Commande</h2>

            <div>
                <jhi-alert-error></jhi-alert-error>

                <div class="form-group" [hidden]="!editForm.get('id')!.value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id" readonly />
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="tsGatewayAngApp.clientSalesCommande.dateCommande" for="field_dateCommande">Date Commande</label>
                    <div class="d-flex">
                        <input id="field_dateCommande" type="datetime-local" class="form-control" name="dateCommande" formControlName="dateCommande" placeholder="YYYY-MM-DD HH:mm"/>
                    </div>
                    <div *ngIf="editForm.get('dateCommande')!.invalid && (editForm.get('dateCommande')!.dirty || editForm.get('dateCommande')!.touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('dateCommande')?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.get('dateCommande')?.errors?.ZonedDateTimelocal" jhiTranslate="entity.validation.ZonedDateTimelocal">
                            This field should be a date and time.
                        </small>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="tsGatewayAngApp.clientSalesCommande.statut" for="field_statut">Statut</label>
                    <select type="text" class="form-control" name="statut" id="field_statut"
                            formControlName="statut">
                        <option value="EN_ATTENTE"> {{ 'tsGatewayAngApp.Statut.EN_ATTENTE' | translate }} </option>
                        <option value="VALIDEE">{{ 'tsGatewayAngApp.Statut.VALIDEE' | translate }}</option>
                        <option value="REFUSEE">{{ 'tsGatewayAngApp.Statut.REFUSEE' | translate }}</option>
                        <option value="ANNULEE">{{ 'tsGatewayAngApp.Statut.ANNULEE' | translate }}</option>
                        <option value="LIVREE">{{ 'tsGatewayAngApp.Statut.LIVREE' | translate }}</option>
                    </select>
                    <div *ngIf="editForm.get('statut')!.invalid && (editForm.get('statut')!.dirty || editForm.get('statut')!.touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('statut')?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="tsGatewayAngApp.clientSalesCommande.total" for="field_total">Total</label>
                    <input type="number" class="form-control" name="total" id="field_total"
                           formControlName="total"/>
                    <div *ngIf="editForm.get('total')!.invalid && (editForm.get('total')!.dirty || editForm.get('total')!.touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('total')?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.get('total')?.errors?.number" jhiTranslate="entity.validation.number">
                            This field should be a number.
                        </small>
                    </div>
                </div>

                <!-- Client -->
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="tsGatewayAngApp.clientSalesCommande.client" for="field_client">Client</label>
                    <select class="form-control" id="field_client" name="client" formControlName="clientId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="clientOption.id" *ngFor="let clientOption of clients; trackBy: trackById">
                            {{ clientOption.nom }}
                        </option>
                    </select>
                </div>

                <!-- Point de Vente -->
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="tsGatewayAngApp.clientSalesCommande.pointDeVente" for="field_pointDeVente">Point De Vente</label>
                    <select class="form-control" id="field_pointDeVente" name="pointDeVente" formControlName="pointDeVenteId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="pointDeVenteOption.id" *ngFor="let pointDeVenteOption of pointdeventes; trackBy: trackById">
                            {{ pointDeVenteOption.nom }}
                        </option>
                    </select>
                </div>

                <!-- <div class="form-group">
                     <label class="form-control-label" jhiTranslate="tsGatewayAngApp.clientSalesCommande.client" for="field_client">Client</label>
                     <select class="form-control" id="field_client" name="client" formControlName="clientId">
                         <option [ngValue]="null"></option>
                         <option [ngValue]="clientOption.id" *ngFor="let clientOption of clients; trackBy: trackById">{{ clientOption.id }}</option>
                     </select>
                 </div>

                 <div class="form-group">
                     <label class="form-control-label" jhiTranslate="tsGatewayAngApp.clientSalesCommande.pointDeVente" for="field_pointDeVente">Point De Vente</label>
                     <select class="form-control" id="field_pointDeVente" name="pointDeVente" formControlName="pointDeVenteId">
                         <option [ngValue]="null"></option>
                         <option [ngValue]="pointDeVenteOption.id" *ngFor="let pointDeVenteOption of pointdeventes; trackBy: trackById">{{ pointDeVenteOption.id }}</option>
                     </select>
                 </div>-->
             </div>

             <div>
                 <button type="button" id="cancel-save" class="btn btn-secondary" (click)="previousState()">
                     <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                 </button>

                 <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                     <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                 </button>
             </div>
         </form>
     </div>
 </div>
