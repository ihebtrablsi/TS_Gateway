<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="auditStock">
            <h2><span jhiTranslate="tsGatewayAngApp.productInventoryAuditStock.detail.title">Audit Stock</span> {{ auditStock.id }}</h2>

            <hr>

            <jhi-alert-error></jhi-alert-error>

            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryAuditStock.dateAudit">Date Audit</span></dt>
                <dd>
                    <span>{{ auditStock.dateAudit }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryAuditStock.statut">Statut</span></dt>
                <dd>
                    <span>{{ auditStock.statut }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryAuditStock.commentaire">Commentaire</span></dt>
                <dd>
                    <span>{{ auditStock.commentaire }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryAuditStock.depot">Depot</span></dt>
                <dd>
                    <div *ngIf="auditStock.depotId">
                        <a [routerLink]="['/depot', auditStock.depotId, 'view']">{{ auditStock.depotId }}</a>
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/audit-stock', auditStock.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
            </button>
        </div>
    </div>
</div>
