<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="promotion">
            <h2><span jhiTranslate="tsGatewayAngApp.productInventoryPromotion.detail.title">Promotion</span> {{ promotion.id }}</h2>

            <hr>

            <jhi-alert-error></jhi-alert-error>

            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryPromotion.nom">Nom</span></dt>
                <dd>
                    <span>{{ promotion.nom }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryPromotion.dateDebut">Date Debut</span></dt>
                <dd>
                    <span>{{ promotion.dateDebut }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryPromotion.dateFin">Date Fin</span></dt>
                <dd>
                    <span>{{ promotion.dateFin }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryPromotion.remise">Remise</span></dt>
                <dd>
                    <span>{{ promotion.remise }}</span>
                </dd>
                <dt><span jhiTranslate="tsGatewayAngApp.productInventoryPromotion.produit">Produit</span></dt>
                <dd>
                    <div *ngIf="promotion.produitId">
                        <a [routerLink]="['/produit', promotion.produitId, 'view']">{{ ProduitNom }}</a>
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/promotion', promotion.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
            </button>
        </div>
    </div>
</div>
